<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

s":"0.5rem","space-md":"1.5rem","margin-sm":"1rem","margin":"1.5rem","space-sm":"1rem"},fontFamily:{"label-sm":["Inter"],"code-md":["JetBrains Mono"],"body-md":["Inter"],"code-sm":["JetBrains Mono"],"headline-lg":["Inter"],"headline-md":["Inter"],"headline-xl":["Inter"],"headline-sm":["Inter"],"body-lg":["Inter"],"body-sm":["Inter"],"label-md":["Inter"]},fontSize:{"label-sm":["11px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}],"code-md":["13px",{"lineHeight":"20px","fontWeight":"400"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"code-sm":["11px",{"lineHeight":"16px","fontWeight":"400"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"headline-md":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-xl":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"600"}],"headline-sm":["16px",{"lineHeight":"24px","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"label-md":["13px",{"lineHeight":"18px","fontWeight":"600"}]}}}};</script></head><body class="min-h-full bg-background font-body-md text-body-md text-on-surface antialiased"><main class="min-h-screen w-full flex flex-col justify-center items-center p-gutter-lg"><div class="flex flex-col w-full items-center justify-center py-space-xl">
<div class="w-full max-w-[400px] flex flex-col bg-surface-container-lowest rounded-xl shadow-md p-space-lg sm:p-space-xl">
<!-- Branding Header -->
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="w-12 h-12 mb-space-sm flex items-center justify-center">
<img alt="Incident Intel Logo" class="w-12 h-12 object-contain rounded" src="https://lh3.googleusercontent.com/aida/AEtjO1UzHvY4XytUxQKiTjLVCaOv-41KCYsWrgKeSAJ7Uy0XosN1acp_lWZ9qinlHlYTFglL84OSMRTY6Vk9IWJbMqd1ULbe6KhgrPL4tmK4DQXnqnGnuFsTDXXnRxaZk3DEnImvpwjCffOB8Ga-GgyUInJJGildEot2KQNhYuGYFx1haUCc6ETAFG6PFLwHGGvt_ly5oIk2Bl17xxsVenMWbWe8_1Bp4G1vKF5Ep5MNqaxyH--tXyU2wIK03A"/>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight mb-space-xs">
        Incident Intel
      </span>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">
        Create your account
      </h2>
<p class="font-body-md text-body-md text-secondary">
        Get visibility into incidents the moment they happen.
      </p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-space-sm" id="register-form" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="full-name">
          Full Name
        </label>
<div class="relative w-full">
<input class="w-full h-9 px-3 bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-md rounded font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container" id="full-name" name="fullName" placeholder="e.g. Alex Vance" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">
          Email
        </label>
<div class="relative w-full">
<input class="w-full h-9 px-3 bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-md rounded font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="password">
          Password
        </label>
<div class="relative flex items-center w-full">
<input class="w-full h-9 pl-3 pr-10 bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-md rounded font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2.5 p-1 text-secondary hover:text-on-surface flex items-center justify-center transition-colors" onclick="togglePasswordVisibility('password', 'password-toggle-icon')" type="button">
<span class="material-symbols-outlined text-lg leading-none select-none" id="password-toggle-icon">
              visibility
            </span>
</button>
</div>
<p class="font-body-sm text-body-sm text-secondary">
          Must be at least 12 characters
        </p>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">
          Confirm Password
        </label>
<div class="relative flex items-center w-full">
<input class="w-full h-9 pl-3 pr-10 bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-md rounded font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container" id="confirm-password" name="confirmPassword" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-2.5 p-1 text-secondary hover:text-on-surface flex items-center justify-center transition-colors" onclick="togglePasswordVisibility('confirm-password', 'confirm-password-toggle-icon')" type="button">
<span class="material-symbols-outlined text-lg leading-none select-none" id="confirm-password-toggle-icon">
              visibility
            </span>
</button>
</div>
</div>
<!-- Submit CTA Button -->
<div class="pt-2">
<button class="w-full h-9 bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md rounded flex items-center justify-center transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-fixed" type="submit">
          Create Account
        </button>
</div>
</form>
<!-- Footer Action -->
<div class="mt-space-md pt-space-sm text-center">
<p class="font-body-md text-body-md text-secondary">
        Already have an account? 
        <a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors ml-1" href="/login">
          Sign in
        </a>
</p>
</div>
<!-- Security & Operational Metadata Footer -->
<div class="mt-space-md pt-space-xs flex items-center justify-center gap-1.5 text-secondary opacity-75">
<span class="material-symbols-outlined text-sm">lock</span>
<span class="font-code-sm text-code-sm uppercase tracking-wider">
        TLS 1.3 End-to-End Encrypted Provisioning
      </span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main></body></html>
