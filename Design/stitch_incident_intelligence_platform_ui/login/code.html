<!-- Status Aura / Subtle Ambient Backdrop Container -->
<div class="w-full max-w-[420px] px-gutter flex flex-col items-center">
<!-- Top System Telemetry Monospace Indicator -->
<div class="flex items-center gap-space-xs mb-space-md text-secondary font-code-sm text-code-sm tracking-wider uppercase">
<span class="inline-block w-2 h-2 rounded-full bg-tertiary-container animate-pulse"></span>
<span>Cluster Auth Node // 04-US-EAST</span>
</div>
<!-- Main Authentication Panel -->
<div class="w-full bg-surface-container-lowest shadow-md rounded-xl p-space-lg flex flex-col relative overflow-hidden">
<!-- Brand & Header Identity Block -->
<div class="flex flex-col items-center text-center pt-space-xs">
<div class="w-12 h-12 mb-space-xs flex items-center justify-center">
<img alt="Incident Intel Platform Logo" class="w-10 h-10 object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AEtjO1UzHvY4XytUxQKiTjLVCaOv-41KCYsWrgKeSAJ7Uy0XosN1acp_lWZ9qinlHlYTFglL84OSMRTY6Vk9IWJbMqd1ULbe6KhgrPL4tmK4DQXnqnGnuFsTDXXnRxaZk3DEnImvpwjCffOB8Ga-GgyUInJJGildEot2KQNhYuGYFx1haUCc6ETAFG6PFLwHGGvt_ly5oIk2Bl17xxsVenMWbWe8_1Bp4G1vKF5Ep5MNqaxyH--tXyU2wIK03A"/>
</div>
<span class="font-headline-sm text-headline-sm tracking-tight text-on-surface">Incident Intel</span>
</div>
<div class="mt-space-md text-center">
<h2 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">Sign in to your account</h2>
<p class="font-body-md text-body-md text-secondary mt-1">Track and resolve incidents across your services.</p>
</div>
<!-- Error State Banner per Specification -->
<div class="mt-space-md flex items-start gap-space-xs p-3 rounded-xl bg-error-container/40 text-on-error-container transition-all duration-200" id="error-banner">
<span class="material-symbols-outlined text-error text-[18px] leading-tight select-none mt-0.5">error</span>
<div class="flex-1 flex justify-between items-center">
<p class="font-body-sm text-body-sm font-semibold text-error">Invalid email or password.</p>
<button class="text-error opacity-70 hover:opacity-100 flex items-center p-0.5" onclick="document.getElementById('error-banner').classList.add('hidden')" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
<!-- Authentication Form -->
<form class="mt-space-md flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<input autocomplete="email" class="w-full h-9 px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface rounded-xl placeholder:text-outline shadow-sm focus:outline-none focus:bg-surface-container-low transition-colors" id="email" name="email" placeholder="you@company.com" type="email" value="alex.vance@company.com"/>
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-1.5 text-left">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-9 pl-3 pr-10 font-body-md text-body-md bg-surface-container-lowest text-on-surface rounded-xl placeholder:text-outline shadow-sm focus:outline-none focus:bg-surface-container-low transition-colors font-code-md" id="password" name="password" placeholder="Enter your password" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-2.5 text-secondary hover:text-on-surface flex items-center justify-center p-1 transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[18px]" id="eye-icon">visibility</span>
</button>
</div>
<!-- Secondary Link: Forgot Password with Tooltip/Hint -->
<div class="flex justify-end mt-1">
<div class="relative group">
<button class="font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors cursor-pointer" title="Contact security admin to reset SSO/internal access" type="button">
                Forgot password?
              </button>
<div class="absolute right-0 bottom-full mb-1 hidden group-hover:flex flex-col items-end pointer-events-none z-10 w-48">
<span class="bg-inverse-surface text-inverse-on-surface font-code-sm text-code-sm py-1 px-2 rounded shadow-md text-right">
                  SSO resets governed by Okta/SecOps
                </span>
</div>
</div>
</div>
</div>
<!-- Submit Action -->
<div class="mt-1">
<button class="w-full h-9 bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md rounded-xl shadow-sm transition-all duration-150 flex items-center justify-center gap-2 active:scale-[0.99]" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Card Footer Notice -->
<div class="mt-space-lg pt-space-sm text-center">
<p class="font-body-md text-body-md text-secondary">
          Don't have an account? 
          <a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors ml-1" href="/register">
            Sign up
          </a>
</p>
</div>
</div>
<!-- Operational System Status Footer Badge -->
<div class="mt-space-md flex items-center justify-between w-full px-2 text-secondary font-code-sm text-code-sm">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>
<span class="font-code-sm text-secondary">Zero Incidents Active</span>
</div>
<div class="text-secondary font-code-sm">v2.4.19-audit</div>
</div>
</div>
<script>
    (function initPasswordToggle() {
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');

      if (!toggleBtn || !passInput || !eyeIcon) return;

      toggleBtn.addEventListener('click', () => {
        const isPassword = passInput.getAttribute('type') === 'password';
        passInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    })();
  </script>
</div></main></body></html>
