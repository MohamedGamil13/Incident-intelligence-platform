<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-surface px-gutter py-space-lg">
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute left-1/2 top-1/2 h-[560px] w-[560px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-primary-fixed/40 blur-3xl"></div>
  </div>

  <div class="relative z-10 flex w-full max-w-[400px] flex-col rounded-xl bg-surface-container-lowest p-space-lg shadow-float sm:p-space-xl">
    <div class="mb-space-lg flex flex-col items-center text-center">
      <div class="mb-space-sm flex h-12 w-12 items-center justify-center rounded-lg bg-primary-container">
        <span class="material-symbols-outlined text-[26px] text-on-primary">lock_reset</span>
      </div>
      <span class="mb-space-xs font-headline-sm text-headline-sm tracking-tight text-on-surface">Incident Intel</span>
      <h2 class="mb-1 font-headline-md text-headline-md text-on-surface">Reset your password</h2>
      <p class="font-body-md text-body-md text-secondary">Set a new password, then verify the 6-digit code we email you.</p>
    </div>

    @if (errorMessage()) {
      <div class="mb-space-sm flex items-start gap-space-xs rounded-lg bg-error-container/40 p-3">
        <span class="material-symbols-outlined mt-0.5 text-[18px] leading-tight text-error">error</span>
        <p class="flex-1 font-body-sm text-body-sm font-semibold text-error">{{ errorMessage() }}</p>
      </div>
    }

    <form class="flex flex-col gap-space-sm" [formGroup]="form" (ngSubmit)="submit()">
      <div class="flex flex-col gap-1">
        <label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@company.com"
          class="h-9 w-full rounded bg-surface-container-lowest px-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-label-md text-label-md text-on-surface" for="new-password">New Password</label>
        <div class="relative flex w-full items-center">
          <input
            id="new-password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="new-password"
            placeholder="********"
            class="h-9 w-full rounded bg-surface-container-lowest pl-3 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container"
          />
          <button
            type="button"
            class="absolute right-2.5 flex items-center justify-center p-1 text-secondary transition-colors hover:text-on-surface"
            (click)="showPassword.update((v) => !v)"
          >
            <span class="material-symbols-outlined text-lg leading-none">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-label-md text-label-md text-on-surface" for="confirm-password">Confirm Password</label>
        <input
          id="confirm-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="********"
          class="h-9 w-full rounded bg-surface-container-lowest px-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container"
        />
      </div>

      <div class="pt-2">
        <button
          type="submit"
          [disabled]="submitting()"
          class="flex h-9 w-full items-center justify-center gap-2 rounded bg-primary-container font-label-md text-label-md text-on-primary shadow-sm transition-colors hover:bg-primary disabled:opacity-60"
        >
          @if (submitting()) {
            <span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span>
          }
          {{ submitting() ? 'Sending code...' : 'Send verification code' }}
        </button>
      </div>
    </form>

    <div class="mt-space-md border-t border-border-subtle pt-space-sm text-center">
      <p class="font-body-md text-body-md text-secondary">
        Remembered it?
        <a routerLink="/auth/login" class="ml-1 font-label-md text-label-md text-primary-container transition-colors hover:text-primary">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
